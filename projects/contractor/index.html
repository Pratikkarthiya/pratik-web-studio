<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>SolidLine Cases — Portfolio Demo</title>
<meta name="description" content="A contractor case-study site with a sample estimate. Not a real quote.">
<style>
:root{--bg:#10110f;--ink:#f3f0e6;--muted:#b7b2a4;--yellow:#e2ff55;--line:#2c2e28}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
a{color:var(--yellow)}
button,input,select{font:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.demo{font-size:12px;text-align:center;padding:8px 12px;background:#000;color:#ddd}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 4vw;border-bottom:1px solid var(--line);letter-spacing:1px;font-size:12px;text-transform:uppercase}
h1{font-size:clamp(48px,8vw,92px);line-height:.9;letter-spacing:-3px;margin:18px 4vw;font-weight:800}
.cases{display:flex;gap:8px;padding:0 4vw 10px;flex-wrap:wrap}
.cases button{background:transparent;color:var(--ink);border:1px solid var(--line);padding:10px 14px;cursor:pointer}
.cases button.on{background:var(--yellow);color:#111;border-color:var(--yellow)}
.case{margin:10px 4vw 24px;display:grid;grid-template-columns:1.1fr .9fr;border:1px solid var(--line)}
.shot{min-height:280px;background:
  linear-gradient(#ffffff14 1px,transparent 1px) 0 0/100% 28px,
  linear-gradient(90deg,#ffffff14 1px,transparent 1px) 0 0/28px 100%,
  #1a1c17;position:relative}
.shot span{position:absolute;left:16px;bottom:14px;font-size:12px;letter-spacing:1px}
.copy{padding:22px}
.index{color:var(--yellow);font-weight:800;letter-spacing:2px}
.copy h2{font-size:clamp(28px,4vw,42px);letter-spacing:-1px;margin:8px 0}
.copy p{color:var(--muted);line-height:1.6}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.specs div{border-top:1px solid var(--line);padding-top:8px}
.specs b{display:block;font-size:18px}
.specs span{color:var(--muted);font-size:12px}
.calc{margin:10px 4vw 40px;background:var(--yellow);color:#14140f;padding:22px;display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
.calc h2{margin:0 0 8px;font-size:32px;letter-spacing:-1px}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid #111;background:#f7ffd4}
.out{font-size:clamp(32px,4vw,48px);font-weight:800;letter-spacing:-1px;line-height:1}
.fine{font-size:12px;max-width:36ch}
@media(max-width:800px){
  .case,.calc{grid-template-columns:1fr}
  h1{letter-spacing:-1.5px}
}
</style>
</head>
<body>
<div class="demo">Portfolio demo · fictional contractor · the figure is a sample range, not a quote · <a href="../../#work">Back to portfolio</a></div>
<header class="top"><span>SolidLine / cases</span><a href="../../#contact">Start a project</a></header>
<h1>Show the job.<br>Then the range.</h1>
<div class="cases" id="tabs"></div>
<article class="case">
  <div class="shot" id="shot"><span id="code"></span></div>
  <div class="copy">
    <div class="index" id="index"></div>
    <h2 id="name"></h2>
    <p id="text"></p>
    <div class="specs" id="specs"></div>
  </div>
</article>
<section class="calc">
  <div>
    <h2>Sample range</h2>
    <p>Move the area and finish. The number is a teaching tool for the layout, not a site visit quote.</p>
    <label for="area">Area in m²</label>
    <input id="area" type="number" min="20" max="500" value="80">
    <label for="finish">Finish</label>
    <select id="finish">
      <option value="900">Basic repair</option>
      <option value="1400" selected>Standard finish</option>
      <option value="2200">Detailed finish</option>
    </select>
  </div>
  <div>
    <div class="out" id="out"></div>
    <p class="fine" id="fine"></p>
  </div>
</section>
<script>
const jobs = [
  { id:"01", code:"HOUSE / 01", name:"Repaint a 2BHK", text:"Walls, ceilings, and woodwork for a lived-in flat. The page leads with the job, not a row of service icons.", specs:[["4 days","On site"],["Interior","Scope"],["Ahmedabad","Sample city"],["Paint","Trade"]] },
  { id:"02", code:"SHOP / 02", name:"A 40 m² shopfront", text:"Shutters, sign wall, and a simple interior so a new shop can open. Specs sit beside the drawing, like a job sheet.", specs:[["12 days","On site"],["Retail","Scope"],["Surat","Sample city"],["Civil","Trade"]] },
  { id:"03", code:"ROOM / 03", name:"One extra room", text:"A single-room add-on: slab, walls, and finish. Used to show how a contractor site can explain one job clearly.", specs:[["3 weeks","On site"],["Extension","Scope"],["Vadodara","Sample city"],["Masonry","Trade"]] }
];
let current = 0;
function renderJob(){
  const job = jobs[current];
  document.getElementById("tabs").innerHTML = jobs.map((j,i) =>
    `<button type="button" class="${i===current?"on":""}" data-i="${i}" aria-pressed="${i===current}">${j.id} ${j.name}</button>`
  ).join("");
  document.getElementById("code").textContent = job.code;
  document.getElementById("index").textContent = "CASE " + job.id;
  document.getElementById("name").textContent = job.name;
  document.getElementById("text").textContent = job.text;
  document.getElementById("specs").innerHTML = job.specs.map(s => `<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join("");
  document.getElementById("shot").style.background =
    `linear-gradient(#ffffff14 1px,transparent 1px) 0 0/100% 28px,linear-gradient(90deg,#ffffff14 1px,transparent 1px) 0 0/28px 100%,hsl(${80 + current*40} 10% 12%)`;
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { current = +b.dataset.i; renderJob(); });
}
function renderRange(){
  const area = Math.max(20, Math.min(500, Number(document.getElementById("area").value) || 0));
  const rate = Number(document.getElementById("finish").value);
  const low = area * rate;
  const high = Math.round(low * 1.18);
  const rupee = n => "₹" + n.toLocaleString("en-IN");
  document.getElementById("out").textContent = rupee(low) + " – " + rupee(high);
  document.getElementById("fine").textContent = area + " m² at a sample rate. A real quote needs a site visit, materials, and your city’s labour. This does not book work.";
}
document.getElementById("area").addEventListener("input", renderRange);
document.getElementById("finish").addEventListener("change", renderRange);
renderJob();
renderRange();
</script>
</body>
</html>
