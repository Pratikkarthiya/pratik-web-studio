<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Market Lane Aisle — Portfolio Demo</title>
<meta name="description" content="A local shop catalog concept by Pratik Web Studio. Nothing is for sale.">
<style>
:root{--ink:#1c1917;--line:#e7e0d6;--paper:#faf7f2;--clay:#9a3412}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,system-ui,sans-serif}
a{color:inherit}
button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #c2410c;outline-offset:2px}
.demo{background:#1c1917;color:#faf7f2;text-align:center;font-size:12px;padding:8px 12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 4vw;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0}
.brand{font-weight:800;letter-spacing:-.4px}
.tools{display:flex;gap:8px;align-items:center}
input[type="search"]{border:1px solid var(--line);border-radius:999px;padding:10px 14px;min-width:180px;background:#fff}
.bag{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:10px 14px}
.layout{display:grid;grid-template-columns:180px 1fr;gap:18px;padding:18px 4vw 40px}
.filters{display:flex;flex-direction:column;gap:6px}
.filters button{text-align:left;border:0;background:transparent;padding:8px 0;border-bottom:1px solid var(--line)}
.filters button.on{font-weight:800;color:var(--clay)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h1{font-size:clamp(32px,4vw,48px);letter-spacing:-1.5px;margin:0}
.count{color:#78716c;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.swatch{height:120px}
.card div{padding:12px}
.card h2{font-size:16px;margin:0 0 4px}
.card p{margin:0;color:#78716c;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.card button{border:1px solid var(--ink);background:#fff;border-radius:8px;padding:8px 10px}
.card button.in{background:var(--ink);color:#fff}
.drawer{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.drawer li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.total{font-weight:800;margin-top:8px}
.note{color:#78716c;font-size:12px}
@media(max-width:800px){
  .layout,.grid{grid-template-columns:1fr}
  .filters{flex-direction:row;overflow:auto}
  .filters button{border:1px solid var(--line);border-radius:99px;padding:8px 12px;background:#fff;white-space:nowrap}
  .bar{flex-wrap:wrap}
  input[type="search"]{min-width:0;flex:1}
}
@media(min-width:1100px){
  .layout{grid-template-columns:220px minmax(0,1fr);gap:28px;padding:28px 4vw 56px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .filters{position:sticky;top:78px;align-self:start}
}
</style>
</head>
<body>
<div class="demo">Portfolio demo · fictional shop · the bag does not check out or take payment · <a href="../../#work">Back to portfolio</a></div>
<header class="bar">
  <div class="brand">Market Lane</div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search the aisle" aria-label="Search products">
    <button class="bag" type="button" id="bag">Bag 0</button>
  </div>
</header>
<div class="layout">
  <aside class="filters" id="filters"></aside>
  <main>
    <div class="head">
      <h1 id="aisle">All aisles</h1>
      <div class="count" id="count"></div>
    </div>
    <div class="grid" id="grid"></div>
    <section class="drawer" id="drawer" hidden>
      <strong>Bag</strong>
      <ul id="lines"></ul>
      <div class="total" id="total"></div>
      <p class="note">Sample total only. This store does not sell or deliver.</p>
      <p><a href="../../#contact">Want a catalog like this for your shop?</a></p>
    </section>
  </main>
</div>
<script>
const products = [
  { id:"rice", name:"Daily rice", cat:"Grocery", note:"1 kg · sample", price:62, color:"#f3e2c2" },
  { id:"oil", name:"Groundnut oil", cat:"Grocery", note:"1 L · sample", price:210, color:"#f6d98a" },
  { id:"soap", name:"Bath soap", cat:"Home", note:"Pack of 3", price:99, color:"#d9e7f5" },
  { id:"bulb", name:"LED bulb", cat:"Home", note:"9W · sample", price:120, color:"#efe7a8" },
  { id:"tea", name:"Leaf tea", cat:"Grocery", note:"250 g · sample", price:145, color:"#d7c4a3" },
  { id:"notebook", name:"Notebook", cat:"Stationery", note:"172 pages", price:55, color:"#f7d7d0" }
];
const cats = ["All","Grocery","Home","Stationery"];
let cat = "All";
let q = "";
const bag = new Map();
function money(n){ return "₹" + n.toLocaleString("en-IN"); }
function render(){
  document.getElementById("filters").innerHTML = cats.map(c =>
    `<button type="button" class="${c===cat?"on":""}" data-cat="${c}" aria-pressed="${c===cat}">${c}</button>`
  ).join("");
  const list = products.filter(p => (cat==="All" || p.cat===cat) && (p.name+" "+p.cat).toLowerCase().includes(q));
  document.getElementById("aisle").textContent = cat === "All" ? "All aisles" : cat;
  document.getElementById("count").textContent = list.length + " items · sample stock";
  document.getElementById("grid").innerHTML = list.map(p => `
    <article class="card">
      <div class="swatch" style="background:${p.color}"></div>
      <div>
        <h2>${p.name}</h2>
        <p>${p.note}</p>
        <div class="row"><b>${money(p.price)}</b><button type="button" data-id="${p.id}" class="${bag.has(p.id)?"in":""}">${bag.has(p.id)?"In bag":"Add"}</button></div>
      </div>
    </article>`).join("") || "<p>Nothing matches that search.</p>";
  const lines = [...bag.values()];
  document.getElementById("bag").textContent = "Bag " + lines.reduce((s,i)=>s+i.qty,0);
  const drawer = document.getElementById("drawer");
  drawer.hidden = lines.length === 0;
  document.getElementById("lines").innerHTML = lines.map(i => `<li><span>${i.name} × ${i.qty}</span><span>${money(i.price*i.qty)}</span></li>`).join("");
  document.getElementById("total").textContent = "Sample total " + money(lines.reduce((s,i)=>s+i.price*i.qty,0));
  document.querySelectorAll("#filters button").forEach(b => b.onclick = () => { cat = b.dataset.cat; render(); });
  document.querySelectorAll("#grid button").forEach(b => b.onclick = () => {
    const p = products.find(x => x.id === b.dataset.id);
    const cur = bag.get(p.id);
    if (cur) bag.set(p.id, { ...cur, qty: cur.qty + 1 });
    else bag.set(p.id, { ...p, qty: 1 });
    render();
  });
}
document.getElementById("q").addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); render(); });
render();
</script>
</body>
</html>
